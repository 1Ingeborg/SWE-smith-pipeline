schema_version: 1

paths:
  swesmith_repo: vendor/SWE-smith
  # 仅启用 LM 或 PR Mirror 策略时需要独立的 LLM 环境。这些策略会导入
  # LiteLLM；LLM 虚拟环境安装了与 Python 3.10 兼容的版本。

# 逐个处理仓库；通过变异验证的任务达到此数量后，不再加入新仓库。
target_validated: 45
validation_workers: 4

generation:
  # 程序化策略的通用默认值；下方各仓库仍可覆盖，含义与纯程序化配置相同。
  selected_patches: 15
  max_bugs_per_modifier: 20
  max_entities: 2000
  max_candidates: 500
  timeout_seconds: 1800
  seed: 42
  selection_seed: 42

  # 合并阶段单独验证的补丁数量。每个仓库只验证约 15～20 个候选时，
  # 恰好落在同一文件或模块的有效补丁有限，因此此值不宜过大。
  combine_selected_patches: 15

  # 完全省略此块时，保持原先仅使用程序化策略的行为。
  # 策略按名称配置；省略 enabled 时默认启用。
  strategies:
    # 生成阶段：先于收集、筛选和验证运行。
    procedural:
      enabled: true
      interleave: true
      # 下列上限若未在此处指定，则沿用上方 generation 的默认值：
      # max_bugs_per_modifier、max_entities、max_candidates、timeout_seconds。

    # 以下 LLM 策略会导入 LiteLLM，因此需要使用独立的 LLM 环境。
    lm_rewrite:
      enabled: false
      config_file: vendor/SWE-smith/configs/bug_gen/lm_rewrite.yml
      model: deepseek/deepseek-flash
      n_workers: 4
      max_bugs: 40
      redo_existing: false

    lm_modify:
      enabled: false
      config_file: vendor/SWE-smith/configs/bug_gen/lm_modify.yml
      model: deepseek/deepseek-flash
      n_bugs: 1
      n_workers: 4
      max_bugs: 40

    # 此策略尚未接通。它需要 SWE-bench 任务实例 JSONL；上游 mirror.collect
    # 可从缓存数据集导出，但需要 GITHUB_TOKENS。更关键的是，下方四个仓库
    # 均不在 SWE-bench Verified 中，因此目前没有对应输入。
    # 未提供 instances_files 就启用时，程序会明确报错。
    pr_mirror:
      enabled: false
      # instances_files:
      #   - /data/datasets/swe-bench-verified/<owner>__<repo>.jsonl
      model: deepseek/deepseek-flash
      num_processes: 2

    # 验证后阶段：合并已经验证的补丁，不消耗 API 额度。
    # 合并结果会再次经过收集、验证和导出。
    combine_file:
      enabled: true
      num_patches: 3
      limit_per_file: 15
      max_combos: 100

    combine_module:
      enabled: false
      num_patches: 2
      limit_per_module: 20
      max_combos: 200
      depth: 2

issue_generation:
  enabled: true
  backend: deepseek_reviewed
  workers: 4
  max_output_tokens: 800
  max_failing_tests: 3
  max_rewrites: 1

repositories:
  - repo: pylint-dev__astroid.b114f6b5
    image_name: swebench/swesmith.x86_64.pylint-dev_1776_astroid.b114f6b5
    source_image_name: jyangballin/swesmith.x86_64.pylint-dev_1776_astroid.b114f6b5
    selected_patches: 15

  - repo: pygments__pygments.27649ebb
    image_name: swebench/swesmith.x86_64.pygments_1776_pygments.27649ebb
    source_image_name: jyangballin/swesmith.x86_64.pygments_1776_pygments.27649ebb
    selected_patches: 15

  - repo: pallets__jinja.ada0a9a6
    image_name: swebench/swesmith.x86_64.pallets_1776_jinja.ada0a9a6
    source_image_name: jyangballin/swesmith.x86_64.pallets_1776_jinja.ada0a9a6
    selected_patches: 20

  - repo: oauthlib__oauthlib.1fd52536
