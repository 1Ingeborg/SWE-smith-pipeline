schema_version: 1

paths:
  swesmith_repo: vendor/SWE-smith

# 统一生产计划：40 个仓库，每个仓库最多选取 50 个候选补丁。
# 所有仓库在同一个运行目录中依次处理；中断后用相同 run-id 加 --resume 续跑，
# 已完成的仓库会被跳过。
target_validated: 1200
validation_workers: 2

generation:
  selected_patches: 50
  max_bugs_per_modifier: 60
  max_entities: 3000
  max_candidates: 2000
  timeout_seconds: 3600
  seed: 42
  selection_seed: 42
  combine_selected_patches: 15  # 每仓库最多选 15 个合成候选进入第二轮 Docker 验证
  strategies:
    procedural:
      enabled: true  # 先生成并验证单 Bug，作为同文件合并的输入
    combine_file:
      enabled: true  # 仅合并同一文件内已通过验证的单 Bug
      num_patches: 2  # 每个合成候选使用两个父 Bug
      max_combos: 100
      limit_per_file: -1

issue_generation:
  enabled: true
  backend: deepseek_reviewed
  workers: 2
  max_output_tokens: 800
  max_failing_tests: 3
  max_rewrites: 1

