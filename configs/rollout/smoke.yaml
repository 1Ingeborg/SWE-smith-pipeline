schema_version: 1

run_dir: results/smoke  # 本批题目的统一结果目录；必须已有问题描述和 manifest

prepare:
  template: configs/rollout/shared-tasks.yaml  # 已下载基础镜像之上制作每题 Agent 任务镜像

gold:
  run_id: gold-smoke  # 独立评测结果 ID；不调用 Agent 或模型 API
  evaluation:
    workers: 1  # gold 的 Docker 评测并发
    memory_limit: 4g  # 每个评测容器的内存上限
    timeout_seconds: 120  # 单题测试超时；与 Agent 补丁评测保持一致

experiments:
  mini-swe-agent:  # 启动时显式选择这个框架；不会自动运行另一框架
    rollout_id: deepseek-flash  # 同一批题目下区分模型与温度的结果 ID
    native_config: configs/agent/mini-swe-agent-deepseek-flash.yaml  # 框架原生配置集中放在 configs/agent
    model_name: deepseek/deepseek-flash
    api_base: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY  # 仅写变量名，密钥留在未提交的 .env
    temperature: 0  # 覆盖原生配置的采样温度
    workers: 1  # 同时运行的题目数
    step_limit: 250  # 每题最多执行的 Agent 步数
    cost_limit: 0.0  # 保留现有 mini 配置：不设按题美元费用上限
    max_output_tokens: 4096  # 单次模型回复的 token 上限
    evaluation:
      workers: 1  # Docker 评测并发
      memory_limit: 4g  # 每个评测容器的内存上限
      timeout_seconds: 120  # 单题测试超时

  swe-agent:  # 启动时显式选择这个框架；不会自动运行另一框架
    rollout_id: deepseek-flash  # 新实验 ID；保留旧的安装失败结果
    native_config: configs/agent/deepseek-flash-smith.yaml  # 本批任务使用仓库自带的编辑工具
    model_name: deepseek/deepseek-flash
    api_base: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    temperature: 0  # 显式设置，与 mini 实验一致
    workers: 1  # 同时运行的题目数
    per_instance_call_limit: 30  # 每题模型调用次数上限
    per_instance_cost_limit: 2.0  # 每题美元费用上限
    total_cost_limit: 12.0  # 本次 SWE-agent 实验的美元费用上限
    evaluation:
      workers: 1
      memory_limit: 4g
      timeout_seconds: 120
