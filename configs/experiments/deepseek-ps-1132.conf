# DeepSeek problem-statement generation over the validated task set.
# These are the exact parameters used for the 2026-09-18 run that produced
# 1120 statements (741 accepted). Consumed by scripts/run-problem-statements.sh.

# Data directory: inputs and every artifact, no code.
RUN_DIR=/data/results/full-runs/deepseek-flash-1132-20260918
# Validation reports supplying the private failure evidence.
VALIDATION_DIR=/data/results/multirepo-runs/train500-procedural-20260916/validation-reports
# Dataset file inside RUN_DIR. Six tasks whose only FAIL_TO_PASS entries were
# non-Python files are excluded upstream; see excluded-no-python-f2p.json.
DATASET_NAME=validated-filtered.jsonl

DEEPSEEK_MODEL=deepseek-flash
DEEPSEEK_BASE_URL=https://api.deepseek.com
DEEPSEEK_API_KEY_ENV=DEEPSEEK_API_KEY
DEEPSEEK_THINKING_MODE=disabled

PS_WORKERS=8
PS_MAX_OUTPUT_TOKENS=800
PS_MAX_FAILING_TESTS=3
# Raising this above 1 is the cheapest way to recover the 189 statements that
# were rejected by rules after a single rewrite attempt.
PS_MAX_REWRITES=1
