schema_version: 1

# This pilot deliberately reads only the data generated by our local pipeline.
# It does not load SWE-smith or SWE-bench from Hugging Face.
source:
  dataset: /data/results/multirepo-runs/multirepo-20260914-001/issuegen/accepted.jsonl
  audit: /data/results/multirepo-runs/multirepo-20260914-001/issuegen/audit.jsonl

run_root: /data/results/agent-pilot-runs

selection:
  seed: 42
  per_repository: 3
  require_full_quota: true

task_images:
  repository: swesmith-lab/agent-task
  platform: linux/x86_64
  memory_limit: 10g
  remove_f2p_tests: true
  runtime:
    enabled: true
    repository: swesmith-lab/agent-runtime
    package: swe-rex==1.4.0
    # These are the exact dependencies installed by SWE-agent v1.1.0's
    # edit_anthropic tool. Baking them once per repository avoids a network
    # download at the start of every Agent task.
    tool_packages:
      - tree-sitter==0.21.3
      - tree-sitter-languages==1.10.2
    index_url: http://mirrors.tencentyun.com/pypi/simple
    trusted_host: mirrors.tencentyun.com
