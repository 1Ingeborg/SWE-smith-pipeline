schema_version: 1

paths:
  swesmith_repo: /data/repos/SWE-smith
  swesmith_python: /data/venvs/swesmith/bin/python
  # Required only when an LM or PR Mirror strategy is enabled. Those import
  # litellm, which the main venv cannot load on Python 3.10 (litellm 1.100.1
  # imports typing.NotRequired). The issuegen venv ships a working litellm.
  llm_python: /data/venvs/swesmith-issuegen/bin/python
  issuegen_python: /data/venvs/swesmith-issuegen/bin/python
  run_root: /data/results/multirepo-runs

# Repositories are processed one at a time. This target stops adding new
# repositories after at least this many mutation-validated tasks are available.
target_validated: 45
validation_workers: 4

generation:
  # Shared defaults for the procedural strategy; per-repo entries below can
  # still override them. Semantics are unchanged from the procedural-only
  # configuration.
  selected_patches: 15
  max_bugs_per_modifier: 20
  max_entities: 2000
  max_candidates: 500
  timeout_seconds: 1800
  seed: 42
  selection_seed: 42

  # How many combined patches get selected for the combine stage's own
  # validation round. Keep it modest: combine yield is bounded by how many
  # already-validated patches happen to share a file or module, which is small
  # when only ~15-20 candidates per repo are validated.
  combine_selected_patches: 15

  # Omitting this entire block keeps the original single-procedural behaviour.
  # Strategies are keyed by name; `enabled` defaults to true when omitted.
  strategies:
    # --- generation stage: runs before collect / select / validate ---
    procedural:
      enabled: true
      interleave: true
      # max_bugs_per_modifier / max_entities / max_candidates / timeout_seconds
      # fall back to the generation.* defaults above.

    # These three import litellm and therefore need paths.llm_python.
    lm_rewrite:
      enabled: false
      config_file: /data/repos/SWE-smith/configs/bug_gen/lm_rewrite.yml
      model: openai/qwen3.7-flash-2026-07-15
      n_workers: 4
      max_bugs: 40
      redo_existing: false

    lm_modify:
      enabled: false
      config_file: /data/repos/SWE-smith/configs/bug_gen/lm_modify.yml
      model: openai/qwen3.7-flash-2026-07-15
      n_bugs: 1
      n_workers: 4
      max_bugs: 40

    # Not wired up, and blocked on two things. It needs SWE-bench task-instance
    # JSONL, which has to be exported from the cached dataset at
    # /data/huggingface/datasets/princeton-nlp___swe-bench_verified — the
    # upstream mirror.collect script can do that but requires GITHUB_TOKENS.
    # More fundamentally, none of the four repos below appear in SWE-bench
    # Verified, so there is no input for it to work on either way. Enabling
    # this without instances_files raises a clear error.
    pr_mirror:
      enabled: false
      # instances_files:
      #   - /data/datasets/swe-bench-verified/<owner>__<repo>.jsonl
      model: openai/qwen3.7-flash-2026-07-15
      num_processes: 2

    # --- post-validation stage: merges already-validated patches ---
    # No API cost. Runs after validation because it consumes validated patches
    # as its input; its own output is then collected, validated and exported.
    combine_file:
      enabled: true
      num_patches: 3
      limit_per_file: 15
      max_combos: 100

    combine_module:
      enabled: false
      num_patches: 2
      limit_per_module: 20
      max_combos: 200
      depth: 2

issue_generation:
  enabled: true
  config: configs/issue_gen/ig_v2_qwen.yaml
  demo_pool: /data/datasets/swe-smith-lab/demo-problem-statements.json
  demo_seed: 42
  workers: 4
  audit_policy: balanced
  review_ambiguous: false
  check_reproduction: false

repositories:
  - repo: pylint-dev__astroid.b114f6b5
    image_name: swebench/swesmith.x86_64.pylint-dev_1776_astroid.b114f6b5
    source_image_name: jyangballin/swesmith.x86_64.pylint-dev_1776_astroid.b114f6b5
    selected_patches: 15

  - repo: pygments__pygments.27649ebb
    image_name: swebench/swesmith.x86_64.pygments_1776_pygments.27649ebb
    source_image_name: jyangballin/swesmith.x86_64.pygments_1776_pygments.27649ebb
    selected_patches: 15

  - repo: pallets__jinja.ada0a9a6
    image_name: swebench/swesmith.x86_64.pallets_1776_jinja.ada0a9a6
    source_image_name: jyangballin/swesmith.x86_64.pallets_1776_jinja.ada0a9a6
    selected_patches: 20

  - repo: oauthlib__oauthlib.1fd52536
    image_name: swebench/swesmith.x86_64.oauthlib_1776_oauthlib.1fd52536
    source_image_name: jyangballin/swesmith.x86_64.oauthlib_1776_oauthlib.1fd52536
    selected_patches: 18
