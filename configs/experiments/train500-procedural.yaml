schema_version: 1

paths:
  swesmith_repo: /data/repos/SWE-smith
  swesmith_python: /data/venvs/swesmith/bin/python
  issuegen_python: /data/venvs/swesmith-issuegen/bin/python
  run_root: /data/results/multirepo-runs

# Unified production plan: 40 repositories x up to 50 selected patches.
# All repositories run sequentially in one run directory. Use --resume with
# the same run-id after an interruption; completed repositories are skipped.
target_validated: 1200
validation_workers: 2

generation:
  selected_patches: 50
  max_bugs_per_modifier: 60
  max_entities: 3000
  max_candidates: 2000
  timeout_seconds: 3600
  seed: 42
  selection_seed: 42

issue_generation:
  enabled: true
  config: configs/issue_gen/ig_v2_qwen.yaml
  demo_pool: /data/datasets/swe-smith-lab/demo-problem-statements.json
  demo_seed: 42
  workers: 2
  audit_policy: balanced
  review_ambiguous: false
  check_reproduction: false

