# Full Agent rollout over the 741 accepted problem statements.
# Consumed by scripts/run-agent-rollout.sh; paths without a leading slash are
# resolved against the repository root.

# Data directory: holds inputs and every artifact, no code.
RUN_DIR=/data/results/full-runs/deepseek-agent-741-20260918

PREPARE_CONFIG=configs/experiments/deepseek-agent-741.yaml
AGENT_CONFIG=configs/agent/deepseek-flash.yaml

PREP_ID=accepted-741
ROLLOUT_ID=rollout-741
EVAL_ID=eval-741
EXPECTED_TASKS=711

MODEL_NAME=deepseek/deepseek-flash
API_BASE=https://api.deepseek.com
API_KEY_ENV=DEEPSEEK_API_KEY

SWEAGENT_ROOT=/data/repos/SWE-agent-1.1.0
SWEAGENT_BIN=/data/venvs/sweagent/bin/sweagent

WORKERS_AGENT=2
WORKERS_EVAL=4
# The upstream SWE-smith eval command runs the repository's whole test
# suite, so slow suites (astroid: 1670 tests) need more than the harness
# default of 90s. A harness budget only - the test command is untouched.
EVAL_TIMEOUT_SECONDS=120
PER_INSTANCE_CALL_LIMIT=30
PER_INSTANCE_COST_LIMIT=2.0
# LiteLLM accrues cost at peak rates; off-peak spend is half this ceiling.
TOTAL_COST_LIMIT=10.0
MAX_OFFPEAK_WAIT_MINUTES=240
