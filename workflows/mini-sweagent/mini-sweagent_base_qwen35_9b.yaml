agent:
  step_limit: 75
  cost_limit: 0
  wall_time_limit_seconds: 3600
  max_consecutive_format_errors: 3

environment:
  timeout: 300
  run_args:
    - --rm
    - --memory=10g

model:
  model_name: openai/swe-base
  model_class: lf_compatible_model.LFCompatibleLitellmModel
  cost_tracking: ignore_errors
  model_kwargs:
    api_base: http://127.0.0.1:8000/v1
    api_key: swesmith
    max_tokens: 4096
    temperature: 0.0
    top_p: 1.0
    drop_params: true
    parallel_tool_calls: true
